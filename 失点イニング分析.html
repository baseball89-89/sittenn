<style>

}

  --zone-bg:#18201c; --zone-line:#cfd8d2; --grid:#3c4842;
  --t1:#ff7a6e; --t2:#6ea4ff; --t3:#5fcf8c; --t4:#b98af0; --t5:#f4b04a; --t6:#4fd0d8; --t7:#a8aca5; --t8:#e57bbf;
  --r-B:#7c90a6; --r-CS:#f0b84a; --r-SS:#ff7a6e; --r-F:#a98ce8; --r-IP:#5fcf8c; --r-HBP:#c38b6a; --r-OT:#7d847f; --r-HIT:#ff5d52;
  color-scheme:dark}}

  --bg:#141917; --panel:#1c2320; --panel2:#242c28; --line:#34403a; --fg:#e8ece9; --muted:#9daaa2;

  --t1:#ff7a6e; --t2:#6ea4ff; --t3:#5fcf8c; --t4:#b98af0; --t5:#f4b04a; --t6:#4fd0d8; --t7:#a8aca5; --t8:#e57bbf;
  --r-B:#7c90a6; --r-CS:#f0b84a; --r-SS:#ff7a6e; --r-F:#a98ce8; --r-IP:#5fcf8c; --r-HBP:#c38b6a; --r-OT:#7d847f; --r-HIT:#ff5d52;

.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.opts button{min-height:50px;font-weight:600}

.field button{min-height:46px}
.mv{display:grid;grid-template-columns:minmax(0,9em) 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.mv .opts2{display:flex;gap:6px;flex-wrap:wrap}
.mv .opts2 button{min-width:52px;min-height:44px}
.sum{display:flex;gap:14px;flex-wrap:wrap;font-weight:600}
/* timeline */
.tl{display:flex;flex-direction:column;gap:8px}

@media (max-width:760px){.tlr{grid-template-columns:2em minmax(0,1fr) 64px}.tlr .p{grid-column:1 / -1}.tlr .res{grid-column:2 / -1}}
.tlr .no{font-weight:700;color:var(--muted)}

/* analysis */
.sec{margin-top:18px}
.sec>h2{display:flex;align-items:baseline;gap:8px}
.sec>h2 .i{font-family:var(--mono);color:var(--accent);font-size:14px}

.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:7em 1fr 7.5em;gap:8px;align-items:center;font-size:13.5px}

.bar .t i{display:block;height:100%;border-radius:7px}
.plots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.plots figure{margin:0}
.plots figcaption{font-size:13px;font-weight:600;margin-bottom:4px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted);margin:6px 0}
.legend span{display:inline-flex;align-items:center;gap:4px}
.mx td,.mx th{text-align:center}
.mx td:first-child,.mx th:first-child{text-align:left}
.yes{color:var(--bad);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:80;max-width:90vw}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.innpick button{min-height:36px;padding:4px 10px;font-size:13px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f>*{color:var(--fg)}

@media (prefers-reduced-motion:no-preference){.chip,.types button,.results button{transition:background .12s,border-color .12s}}

<script>
"use strict";
/* ============ 定数 ============ */
const RES={B:'ボール',CS:'見逃し',SS:'空振り',F:'ファウル',IP:'インプレー',HBP:'死球',OT:'その他'};
const RES_S={B:'ボ',CS:'見',SS:'空',F:'フ',IP:'打',HBP:'死',OT:'他'};
const RES_KEY={B:'B',CS:'S',SS:'W',F:'F',IP:'I',HBP:'H',OT:'O'};
const PAR={K:'三振',BB:'四球',HBP:'死球','1B':'単打','2B':'二塁打','3B':'三塁打',HR:'本塁打',SF:'犠牲フライ',SH:'犠牲バント',GO:'内野ゴロ',FO:'外野フライ',E:'エラー',OT:'その他'};
const PAR_ORDER=['K','BB','HBP','1B','2B','3B','HR','SF','SH','GO','FO','E','OT'];
const HITS={'1B':1,'2B':2,'3B':3,HR:4};
const INPLAY=['1B','2B','3B','HR','SF','SH','GO','FO','E'];
const RUNK={SB:'盗塁',CS:'盗塁死',WP:'暴投',PB:'捕逸',BK:'ボーク',PO:'牽制アウト',E:'エラー',OT:'その他'};
const DIRS={1:'投',2:'捕',3:'一',4:'二',5:'三',6:'遊',7:'左',8:'中',9:'右'};
const BB_T={G:'ゴロ',L:'ライナー',F:'フライ'};
const STR=['弱','普通','強','不明'];
const BASEN={1:'一塁',2:'二塁',3:'三塁'};
const COUNTS=['0-0','1-0','2-0','3-0','0-1','1-1','2-1','3-1','0-2','1-2','2-2','3-2'];
const DEFAULT_TYPES=[['ストレート','直'],['スライダー','ス'],['カーブ','カ'],['フォーク','フ'],['チェンジアップ','チ'],['シュート','シ'],['その他','他']];
/* ゾーン座標：x=0 左端, 1 右端（捕手から見て）, y=0 下端, 1 上端 */
const ZW=43.2, ZH=56, X0=-0.75, X1=1.75, Y0=-0.6, Y1=1.6, VBW=(X1-X0)*ZW, VBH=(Y1-Y0)*ZH, BALL_R=3.65;
const sx=x=>(x-X0)*ZW, sy=y=>(Y1-y)*ZH;

/* ============ 状態 ============ */
const S={view:'home',recs:new Map(),innId:null,draft:{type:null,loc:null,speed:''},editId:null,next:{order:1,name:'',hand:'R'},
  sheet:null,confirm:null,redo:[],ro:false,localOk:true,cloud:{status:'local',pending:new Set()},
  an:{pitcher:null,inns:null,hand:'all',tlInn:null,zmode:'batter',ztype:'all'},setupId:null,tlId:null};

/* ============ ユーティリティ ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'—';
function frac(a,b,minN=10){ if(!b) return '<span class="ref">—</span>'; const t=`${Math.round(a/b*100)}%<span class="small muted">（${a}/${b}）</span>`; return b<minN?`<span class="ref" title="分母が少ないため参考">${t}</span>`:t; }
function toast(msg){const t=$('#toast');t.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast._t);toast._t=setTimeout(()=>t.innerHTML='',2200);}
const fmtDiff=d=>d>0?`+${d}`:`${d}`;
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};

/* ============ 保存（IndexedDB）============ */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('shitten-app',1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('records'))d.createObjectStore('records',{keyPath:'id'});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'k'});};r.onsuccess=()=>{IDB.db=r.result;res()};r.onerror=()=>rej(r.error);}catch(e){rej(e)}})},
  tx(store,mode,fn){return new Promise((res,rej)=>{try{const t=IDB.db.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);}catch(e){rej(e)}})},
  async all(){if(!IDB.db)return[];return new Promise((res,rej)=>{const t=IDB.db.transaction('records','readonly');const r=t.objectStore('records').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})},
  put(rec){if(!IDB.db)return Promise.resolve();return IDB.tx('records','readwrite',s=>{s.put(rec)})},
  putMany(recs){if(!IDB.db)return Promise.resolve();return IDB.tx('records','readwrite',s=>{recs.forEach(r=>s.put(r))})},
  del(id){if(!IDB.db)return Promise.resolve();return IDB.tx('records','readwrite',s=>{s.delete(id)})},
  async getMeta(k){if(!IDB.db)return null;return new Promise(res=>{try{const r=IDB.db.transaction('meta','readonly').objectStore('meta').get(k);r.onsuccess=()=>res(r.result?r.result.v:null);r.onerror=()=>res(null)}catch(e){res(null)}})},
  setMeta(k,v){if(!IDB.db)return Promise.resolve();return IDB.tx('meta','readwrite',s=>{s.put({k,v})}).catch(()=>{})}
};

/* ============ クラウド同期（アカウントの保存領域）============ */
const Cloud={db:null,owner:false,
  async init(){
    if(!window.claude||!window.claude.use){S.cloud.status='local';softRender();return}
    let db=null,user=null;
    try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){}
    if(user){try{Cloud.owner=await user.isOwner()}catch(e){Cloud.owner=false}}
    if(!db){S.cloud.status='local';softRender();return}
    Cloud.db=db;
    if(user&&!Cloud.owner){S.ro=true}
    try{
      const snap=await db.collection('records').get();
      const changed=[];
      for(const d of snap.docs){const c=d.data();if(!c||!c.id)continue;const l=S.recs.get(c.id);
        if(!l||(c.updatedAt||0)>(l.updatedAt||0)){const cc=clone(c);S.recs.set(cc.id,cc);changed.push(cc)}}
      if(changed.length&&!S.ro) await IDB.putMany(changed).catch(()=>{});
      if(Cloud.owner){const cloudIds=new Map(snap.docs.map(d=>[d.id,(d.data()||{}).updatedAt||0]));
        for(const r of S.recs.values()){if(!cloudIds.has(r.id)||(r.updatedAt||0)>cloudIds.get(r.id))S.cloud.pending.add(r.id)}
        await Cloud.flush();}
      S.cloud.status=S.ro?'readonly':'ok';
    }catch(e){S.cloud.status='error'}
    softRender();
  },
  async push(rec){S.cloud.pending.add(rec.id);await Cloud.flush()},
  async flush(){
    if(!Cloud.db||!Cloud.owner||S.ro){updSync();return}
    for(const id of [...S.cloud.pending]){
      const r=S.recs.get(id);
      try{ if(r) await Cloud.db.collection('records').doc(id).set(clone(r)); else await Cloud.db.collection('records').doc(id).delete();
        S.cloud.pending.delete(id);S.cloud.status='ok';}
      catch(e){S.cloud.status='error';break}
    }
    IDB.setMeta('pending',[...S.cloud.pending]);updSync();
  }
};

const settings=()=>S.recs.get('settings')||{id:'settings',kind:'settings',pitchTypes:DEFAULT_TYPES.map(([name,abbr])=>({name,abbr,hidden:false})),lastBackupAt:0,inningsSinceBackup:0};

function inningsOf(pid){return live('inning').filter(i=>!pid||i.pitcherId===pid).sort((a,b)=>{const ga=S.recs.get(a.gameId)||{},gb=S.recs.get(b.gameId)||{};return (ga.date||'').localeCompare(gb.date||'')||a.inning-b.inning})}

function innShort(inn){const g=S.recs.get(inn.gameId)||{};return `${(g.date||'').slice(5).replace('-','/')} ${g.opp||''} ${inn.inning}回${inn.half}`}

/* ============ 再計算エンジン ============ */
function basesTxt(b){const on=[1,2,3].filter(k=>b[k]);return on.length?on.map(k=>BASEN[k].slice(0,1)).join('・')+'塁':'走者なし'}
function sitTxt(outs,b){return `${outs}死 ${basesTxt(b)}`}
function replay(inn){
  const st={outs:inn.startOuts||0,bases:{1:null,2:null,3:null},b:0,s:0,runs:0,pa:null,await:null};
  const out={pitches:[],pas:new Map(),paOrder:[],runs:[],steps:[],warnings:[],runner:new Map(),runCtx:new Map()};
  for(const k of [1,2,3]) if(inn.startBases&&inn.startBases[k]){st.bases[k]='S'+k;out.runner.set('S'+k,{how:'inherited',inherited:true,via:[]})}
  const paMap=new Map((inn.pas||[]).map(p=>[p.id,p]));
  const W=(ev,msg)=>out.warnings.push({id:ev.id,msg});
  const newPA=(id)=>{const P={pa:paMap.get(id)||{id},startOuts:st.outs,startBases:{...st.bases},pitches:[],events:[],end:null,runs:0,result:null};out.pas.set(id,P);out.paOrder.push(id);return P};
  for(const ev of (inn.events||[])){
    const before={outs:st.outs,bases:{...st.bases},b:st.b,s:st.s,runs:st.runs};
    if(st.outs>=3&&ev.k!=='fix') W(ev,'3アウトの後にも記録があります');
    if(ev.k==='pitch'){
      if(st.pa!==ev.pa){
        if(st.await) W(ev,'前の打席の結果が入力されないまま、次の打者への投球があります');
        else if(st.pa) W(ev,'前の打席が終わらないまま、次の打者への投球があります');
        st.pa=ev.pa;st.b=0;st.s=0;st.await=null;
        if(!out.pas.has(ev.pa)) newPA(ev.pa);
      } else if(st.await) W(ev,'打席を終える投球の後に、同じ打者への投球があります');
      const P=out.pas.get(ev.pa);
      const rec={ev,pa:ev.pa,n:P.pitches.length+1,b:st.b,s:st.s,outs:st.outs,bases:{...st.bases},terminal:null,last:false};
      if(ev.res==='B'){st.b++;if(st.b>=4)rec.terminal='BB'}
      else if(ev.res==='HBP')rec.terminal='HBP';
      else if(ev.res==='CS'||ev.res==='SS'){st.s++;if(st.s>=3)rec.terminal='K'}
      else if(ev.res==='F'){if(st.s<2)st.s++}
      else if(ev.res==='IP')rec.terminal='IP';
      if(rec.terminal)st.await=rec.terminal;
      P.pitches.push(rec);out.pitches.push(rec);
    } else if(ev.k==='paend'){
      let P=out.pas.get(ev.pa); if(!P)P=newPA(ev.pa);
      if(st.pa&&st.pa!==ev.pa) W(ev,'打席結果が、投球中の打者と対応していません');
      const t=st.pa===ev.pa?st.await:null;
      const need={K:'K',BB:'BB',HBP:'HBP'}[ev.result];
      if(need&&t!==need) W(ev,`${PAR[ev.result]}ですが、最後の投球のカウントと合いません`);
      if(INPLAY.includes(ev.result)&&t!=='IP') W(ev,`${PAR[ev.result]}ですが、最後の投球が「インプレー」になっていません`);
      if(!t&&!need&&!INPLAY.includes(ev.result)&&ev.result!=='OT') W(ev,'打席を終える投球がありません');
      P.end=ev;P.result=ev.result;
      if(P.pitches.length){P.pitches.at(-1).last=true;}
      moves(ev,st,out,P,before);
      st.pa=null;st.b=0;st.s=0;st.await=null;
    } else if(ev.k==='run'){
      const P=st.pa?out.pas.get(st.pa):null; if(P)P.events.push(ev);
      out.runCtx.set(ev.id,st.pa);
      moves(ev,st,out,P,before);
    } else if(ev.k==='fix'){
      st.outs=ev.outs;if(ev.b!=null)st.b=ev.b;if(ev.s!=null)st.s=ev.s;
      for(const k of [1,2,3]){const r=ev.bases&&ev.bases[k]||null;st.bases[k]=r;if(r&&!out.runner.has(r))out.runner.set(r,{how:'fix',via:[]})}
    }
    out.steps.push({ev,before,after:{outs:st.outs,bases:{...st.bases},b:st.b,s:st.s,runs:st.runs}});
  }
  if(st.outs>3) out.warnings.push({id:null,msg:'アウトが3つを超えています'});
  out.state=st;out.done=st.outs>=3;
  const own=out.runs.filter(r=>!r.inherited);
  out.R=own.length;out.ER=own.filter(r=>r.er).length;out.UER=out.R-out.ER;out.inhR=out.runs.length-own.length;
  out.diffEnd=(inn.diffStart||0)-out.runs.length;
  return out;
}
function moves(ev,st,out,P,before){
  const nb={...st.bases};const kind=ev.k==='paend'?ev.result:ev.kind;
  const W=msg=>out.warnings.push({id:ev.id,msg});
  for(const m of (ev.moves||[])){ if(m.from!=='B'){ if(nb[m.from]!==m.r) W(`${BASEN[m.from]||m.from}の走者が記録と合いません`); else nb[m.from]=null; } }
  for(const m of (ev.moves||[])){
    let info;
    if(m.from==='B'){info={how:ev.result,pa:m.r,via:[]};out.runner.set(m.r,info)} else info=out.runner.get(m.r)||{how:'?',via:[]};
    if(m.to==='O'){st.outs++}
    else if(m.to==='H'){st.runs++;const r={r:m.r,ev,kind,isPA:ev.k==='paend',er:m.er!==false,inherited:!!info.inherited,how:info.how,via:[...info.via],outsBefore:before.outs,basesBefore:before.bases,pa:P?P.pa.id:null};out.runs.push(r);if(P)P.runs++;}
    else { if(nb[m.to]) W(`${BASEN[m.to]}に2人の走者がいます`); nb[m.to]=m.r; }
    if(m.from!=='B'&&m.to!==m.from&&m.to!=='O') info.via.push(kind);
  }
  st.bases=nb;
}
/* 走者の動きの初期提案 */
function suggest(kind,bases,batter){
  const on=[3,2,1].filter(k=>bases[k]);const mv=[];
  const adv=n=>on.forEach(k=>mv.push({r:bases[k],from:k,to:k+n>3?'H':k+n}));
  const stay=()=>on.forEach(k=>mv.push({r:bases[k],from:k,to:k}));
  const B=to=>batter&&mv.push({r:batter,from:'B',to});
  switch(kind){
    case 'K':stay();B('O');break;
    case 'BB':case 'HBP':case 'BK_force':{const f1=!!bases[1],f2=f1&&!!bases[2],f3=f2&&!!bases[3];
      if(bases[3])mv.push({r:bases[3],from:3,to:f3?'H':3});if(bases[2])mv.push({r:bases[2],from:2,to:f2?3:2});if(bases[1])mv.push({r:bases[1],from:1,to:2});B(1);break;}
    case '1B':adv(1);B(1);break;
    case '2B':adv(2);B(2);break;
    case '3B':adv(3);B(3);break;
    case 'HR':adv(3);B('H');break;
    case 'SF':on.forEach(k=>mv.push({r:bases[k],from:k,to:k===3?'H':k}));B('O');break;
    case 'SH':adv(1);B('O');break;
    case 'GO':case 'FO':case 'OT':stay();B('O');break;
    case 'E':adv(1);B(1);break;
    case 'SB':case 'WP':case 'PB':case 'BK':adv(1);break;
    case 'CS':case 'PO':{let lead=true;on.forEach(k=>{mv.push({r:bases[k],from:k,to:lead?'O':k});lead=false});break;}
    default:stay();
  }
  return mv.map(m=>({...m,er:defaultER(kind,m)}));
}
function defaultER(kind,m){return !(kind==='E'||kind==='PB')}
function runnerName(rid,inn){
  if(!rid)return'';if(rid.startsWith('S'))return '前の投手の走者';
  const p=(inn.pas||[]).find(p=>p.id===rid);if(!p)return '走者';return `${p.order}番${p.name?' '+p.name:''}`;
}

function silhouette(side){

function zoneSVG(o){
  // o:{hand,mode:'catcher'|'batter',points:[{x,y,fill,stroke,n,big,ring}],draft,interactive,id,labels}
  const hand=o.hand||'R';
  // 捕手視点：右打者は画面左（三塁側）に立つ。打者基準：内角を常に左に
  const batterLeft=o.mode==='batter'?true:hand==='R';
  const lab=o.labels!==false;
  let s=`<svg viewBox="0 0 ${VBW} ${VBH}" ${o.id?`id="${o.id}"`:''} role="img" aria-label="ストライクゾーン" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<rect x="0" y="0" width="${VBW}" height="${VBH}" fill="var(--zone-bg)" rx="3"/>`;
  if(o.showBatter!==false) s+=silhouette(batterLeft?'L':'R');
  const zx=sx(0),zy=sy(1),zw=ZW,zh=ZH;
  for(let i=1;i<3;i++){s+=`<line x1="${zx+zw*i/3}" y1="${zy}" x2="${zx+zw*i/3}" y2="${zy+zh}" stroke="var(--grid)" stroke-width=".35" stroke-dasharray="1.2 1.2"/>`;s+=`<line x1="${zx}" y1="${zy+zh*i/3}" x2="${zx+zw}" y2="${zy+zh*i/3}" stroke="var(--grid)" stroke-width=".35" stroke-dasharray="1.2 1.2"/>`}
  s+=`<rect x="${zx}" y="${zy}" width="${zw}" height="${zh}" fill="none" stroke="var(--zone-line)" stroke-width=".8"/>`;
  // ホームベース（捕手側から見た五角形の上辺）
  s+=`<path d="M${sx(0)} ${sy(-0.42)} h${ZW} l-3 3 h${-(ZW-6)} z" fill="none" stroke="var(--grid)" stroke-width=".5"/>`;
  if(lab){
    const fs=o.small?6:4.2;
    s+=`<text x="${sx(.5)}" y="${sy(1.12)}" font-size="${fs}" text-anchor="middle" fill="var(--muted)">高め</text>`;
    s+=`<text x="${sx(.5)}" y="${sy(-0.18)}" font-size="${fs}" text-anchor="middle" fill="var(--muted)">低め</text>`;
    s+=`<text x="${sx(-0.12)}" y="${sy(.5)}" font-size="${fs}" text-anchor="end" fill="var(--muted)">${batterLeft?'内角':'外角'}</text>`;
    s+=`<text x="${sx(1.12)}" y="${sy(.5)}" font-size="${fs}" fill="var(--muted)">${batterLeft?'外角':'内角'}</text>`;
  }
  for(const p of (o.points||[])){
    if(p.x==null)continue;const r=p.r||BALL_R;
    s+=`<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="${r}" fill="${p.fill}" fill-opacity="${p.op??.9}" stroke="${p.stroke||'var(--panel)'}" stroke-width="${p.sw||.6}"/>`;
    if(p.n!=null)s+=`<text x="${sx(p.x)}" y="${sy(p.y)+1.5}" font-size="${r>3?4.2:3}" text-anchor="middle" fill="#fff" font-weight="700">${p.n}</text>`;
  }
  if(o.heat) s+=o.heat;
  if(o.draft&&o.draft.x!=null){const d=o.draft;
    s+=`<g id="draftmk"><line x1="${sx(d.x)}" y1="0" x2="${sx(d.x)}" y2="${VBH}" stroke="var(--accent)" stroke-width=".3" stroke-dasharray="1 1"/><line x1="0" y1="${sy(d.y)}" x2="${VBW}" y2="${sy(d.y)}" stroke="var(--accent)" stroke-width=".3" stroke-dasharray="1 1"/><circle cx="${sx(d.x)}" cy="${sy(d.y)}" r="${BALL_R}" fill="${d.fill||'var(--accent)'}" fill-opacity=".85" stroke="var(--accent)" stroke-width=".9"/><circle cx="${sx(d.x)}" cy="${sy(d.y)}" r="${BALL_R+1.8}" fill="none" stroke="var(--accent)" stroke-width=".5"/></g>`;
  }
  s+='</svg>';return s;
}
/* 内角・外角をそろえた座標（内角側が0） */
const ixOf=(x,hand)=>hand==='L'?1-x:x;
function region(ix,y){
  if(ix==null||y==null)return '不明';
  if(ix>=0&&ix<=1&&y>=0&&y<=1){const c=ix<1/3?'内角':ix<2/3?'真ん中':'外角';const r=y>2/3?'高め':y>1/3?'':'低め';return (r?r+'・':'')+c}
  const dx=ix<0?-ix:ix>1?ix-1:0,dy=y<0?-y:y>1?y-1:0;
  if(dy>=dx)return y>1?'高めボール':'低めボール';return ix<0?'内角ボール':'外角ボール';
}

function setNextBatter(inn){
  const r=replay(inn);const g=S.recs.get(inn.gameId)||{};
  if(r.state.pa){const p=(inn.pas||[]).find(p=>p.id===r.state.pa);if(p){S.next={order:p.order,name:p.name||'',hand:p.hand};return}}
  const last=(inn.pas||[]).at(-1);

function lastPAhtml(inn,r){

const paName=p=>`${p.order}番${p.name?' '+p.name:''}（${p.hand==='L'?'左':'右'}）`;

  return `<svg viewBox="0 0 70 50" width="96" role="img" aria-label="走者 ${basesTxt(b)}">${c(2,35,12)}${c(3,15,30)}${c(1,55,30)}<rect x="30" y="38" width="10" height="10" transform="rotate(45 35 43)" fill="var(--panel2)" stroke="var(--line)"/></svg>`;
}
function chip(pp,editable){

/* ゾーンのタップ */
function bindZone(){
  const svg=$('#zone');if(!svg||S.ro)return;
  const toLoc=ev=>{const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const m=svg.getScreenCTM();if(!m)return null;const p=pt.matrixTransform(m.inverse());
    let x=p.x/ZW+X0,y=Y1-p.y/ZH;x=Math.max(X0,Math.min(X1,x));y=Math.max(Y0,Math.min(Y1,y));return {x:Math.round(x*1000)/1000,y:Math.round(y*1000)/1000}};
  let drag=false;
  const upd=loc=>{S.draft.loc=loc;const inn=curInn();const r=replay(inn);const pa=r.state.pa?(inn.pas||[]).find(x=>x.id===r.state.pa):null;const hand=pa?pa.hand:S.next.hand;
    let mk=$('#draftmk');const fill=S.draft.type?typeColor(S.draft.type):'var(--accent)';
    const g=`<line x1="${sx(loc.x)}" y1="0" x2="${sx(loc.x)}" y2="${VBH}" stroke="var(--accent)" stroke-width=".3" stroke-dasharray="1 1"/><line x1="0" y1="${sy(loc.y)}" x2="${VBW}" y2="${sy(loc.y)}" stroke="var(--accent)" stroke-width=".3" stroke-dasharray="1 1"/><circle cx="${sx(loc.x)}" cy="${sy(loc.y)}" r="${BALL_R}" fill="${fill}" fill-opacity=".85" stroke="var(--accent)" stroke-width=".9"/><circle cx="${sx(loc.x)}" cy="${sy(loc.y)}" r="${BALL_R+1.8}" fill="none" stroke="var(--accent)" stroke-width=".5"/>`;
    if(!mk){mk=document.createElementNS('http://www.w3.org/2000/svg','g');mk.id='draftmk';svg.appendChild(mk)}
    mk.innerHTML=g;const lr=$('#locread');if(lr)lr.textContent='位置：'+region(ixOf(loc.x,hand),loc.y);
    const nb=document.querySelector('[data-a="noloc"]');if(nb)nb.disabled=false;};
  svg.addEventListener('pointerdown',ev=>{ev.preventDefault();drag=true;try{svg.setPointerCapture(ev.pointerId)}catch(e){}const l=toLoc(ev);if(l)upd(l)});
  svg.addEventListener('pointermove',ev=>{if(!drag)return;const l=toLoc(ev);if(l)upd(l)});
  const end=()=>{drag=false};svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
}
/* 1球を保存 */
async function commitPitch(res){
  if(S.ro)return;const inn=curInn();const d=S.draft;
  if(S.editId){const ev=inn.events.find(e=>e.id===S.editId);if(!ev)return;
    if(!d.type){toast('球種を選んでください');return}
    Object.assign(ev,{type:d.type,loc:d.loc?{...d.loc}:null,speed:d.speed?Number(d.speed):null,res});
    await save(inn);S.editId=null;S.draft={type:null,loc:null,speed:''};toast('修正しました');render();return}
  if(!d.type){toast('先に球種を選んでください');return}
  const r=replay(inn);
  if(r.state.await){toast('先に打席の結果を入力してください');return}
  let paId=r.state.pa;
  if(!paId){
    const pa={id:uid('pa'),seq:(inn.pas||[]).length+1,order:S.next.order,name:(S.next.name||'').trim(),hand:S.next.hand};
    inn.pas=inn.pas||[];inn.pas.push(pa);paId=pa.id;
    const g=S.recs.get(inn.gameId);if(g){g.lineup=g.lineup||{};g.lineup[pa.order]={name:pa.name,hand:pa.hand};save(g)}
  }
  const ev={id:uid('ev'),k:'pitch',pa:paId,type:d.type,loc:d.loc?{...d.loc}:null,speed:d.speed?Number(d.speed):null,res};
  inn.events.push(ev);S.redo=[];
  await save(inn);
  S.draft={type:null,loc:null,speed:''};
  const r2=replay(inn);
  if(r2.state.await){openPaEnd(inn,r2)}
  render();
}
function openPaEnd(inn,r,existing){
  r=r||replay(inn);
  if(existing){
    // 既存の打席結果を修正：その時点の走者状況を使う
    const step=r.steps.find(s=>s.ev.id===existing.id);
    S.sheet={type:'paend',editId:existing.id,pa:existing.pa,result:existing.result,dir:existing.dir||null,bb:existing.bb||null,str:existing.str||null,moves:clone(existing.moves||[]),bases:step?step.before.bases:{1:null,2:null,3:null}};
  } else {
    const t=r.state.await;const res=t==='K'?'K':t==='BB'?'BB':t==='HBP'?'HBP':null;
    S.sheet={type:'paend',pa:r.state.pa,result:res,dir:null,bb:null,str:null,bases:{...r.state.bases},moves:res?suggest(res,r.state.bases,r.state.pa):[]};
  }
}
async function commitPaEnd(){
  const inn=curInn();const sh=S.sheet;
  if(!sh.result){toast('打席結果を選んでください');return}
  const ev={id:sh.editId||uid('ev'),k:'paend',pa:sh.pa,result:sh.result,dir:INPLAY.includes(sh.result)?sh.dir:null,bb:INPLAY.includes(sh.result)?sh.bb:null,str:INPLAY.includes(sh.result)?sh.str:null,moves:sh.moves};
  if(sh.editId){const i=inn.events.findIndex(e=>e.id===sh.editId);inn.events[i]=ev}else{inn.events.push(ev);S.redo=[]}
  await save(inn);S.sheet=null;
  setNextBatter(inn);
  const r=replay(inn);
  if(r.done&&!sh.editId)toast('3アウト。イニング終了です');
  render();
}
function openRun(){const inn=curInn();const r=replay(inn);S.sheet={type:'run',kind:'SB',bases:{...r.state.bases},moves:suggest('SB',r.state.bases,null),note:''}}
async function commitRun(){
  const inn=curInn();const sh=S.sheet;
  const ev={id:sh.editId||uid('ev'),k:'run',kind:sh.kind,moves:sh.moves.filter(m=>m.to!==m.from),note:sh.note||''};
  if(!ev.moves.length){toast('走者の動きを選んでください');return}
  if(sh.editId){const i=inn.events.findIndex(e=>e.id===sh.editId);inn.events[i]=ev}else{inn.events.push(ev);S.redo=[]}
  await save(inn);S.sheet=null;render();
}

function stepOuts(inn,sh){const r=replay(inn);if(sh.editId){const s=r.steps.find(s=>s.ev.id===sh.editId);return s?s.before.outs:0}return r.state.outs}
function movesHTML(sh,inn,withBatter){

/* ============ 分析データ ============ */
function buildData(inns,hand){
  const P=[],PAs=[],INN=[];
  for(const inn of inns){
    const r=replay(inn);annotate(r);
    const g=S.recs.get(inn.gameId)||{};
    const innInfo={inn,r,g,label:innShort(inn)};INN.push(innInfo);
    for(const id of r.paOrder){
      const X=r.pas.get(id);const pa=X.pa;
      if(hand!=='all'&&pa.hand!==hand)continue;
      const scoredRuns=r.runs.filter(x=>x.pa===id);
      const batterScored=r.runs.find(x=>x.r===id);
      const pp=X.pitches.map(q=>{const e=q.ev;const ix=e.loc?ixOf(e.loc.x,pa.hand):null;
        return {inn:inn.id,innLabel:innInfo.label,pa:id,hand:pa.hand,type:e.type,x:e.loc?.x??null,y:e.loc?.y??null,ix,speed:e.speed,res:e.res,b:q.b,s:q.s,cnt:`${q.b}-${q.s}`,outs:q.outs,risp:!!(q.bases[2]||q.bases[3]),on:!!(q.bases[1]||q.bases[2]||q.bases[3]),last:!!(q.last&&X.end),paRes:q.last&&X.end?X.result:null,n:q.n,ev:e,
          reg:region(ix,e.loc?.y??null)}});
      pp.forEach(q=>{q.hit=!!(q.paRes&&HITS[q.paRes]);q.xbh=!!(q.paRes&&HITS[q.paRes]>1);q.tb=q.paRes?HITS[q.paRes]||0:0;q.swing=['SS','F','IP'].includes(q.res);q.strike=['CS','SS','F','IP'].includes(q.res)});
      P.push(...pp);
      PAs.push({inn:inn.id,innInfo,id,pa,res:X.result,end:X.end,pitches:pp,startOuts:X.startOuts,startBases:X.startBases,runs:X.runs,scoredRuns,batterScored,ab:X.result&&!['BB','HBP','SH','SF'].includes(X.result),hit:!!HITS[X.result],tb:HITS[X.result]||0});
    }
  }
  return {P,PAs,INN};
}
function runCause(x){
  if(x.isPA){const k=x.kind;if(HITS[k])return k==='HR'?'本塁打':'適時打（'+PAR[k]+'）';if(k==='BB'||k==='HBP')return '押し出し';if(k==='SF')return '犠牲フライ';if(k==='GO')return '内野ゴロの間';if(k==='E')return 'エラー';return PAR[k]||'その他'}
  return RUNK[x.kind]||'その他';
}
const isMiss=x=>x.kind==='E'||x.kind==='PB'||x.how==='E'||x.via.includes('E')||x.via.includes('PB');

const sec=(i,t,body,note)=>`<section class="sec card" id="s${i}"><h2><span class="i">${i}</span>${t}</h2>${note?`<p class="note">${note}</p>`:''}${body}</section>`;
function secSummary(D){
  let rows='',T={R:0,ER:0,UER:0,inh:0,n:0,bf:0,H:0,XBH:0,BB:0};
  for(const x of D.INN){const r=x.r;const pas=[...r.pas.values()];const H=pas.filter(p=>HITS[p.result]).length,XBH=pas.filter(p=>HITS[p.result]>1).length,BB=pas.filter(p=>p.result==='BB'||p.result==='HBP').length;
    T.R+=r.R;T.ER+=r.ER;T.UER+=r.UER;T.inh+=r.inhR;T.n+=r.pitches.length;T.bf+=pas.length;T.H+=H;T.XBH+=XBH;T.BB+=BB;
    rows+=`<tr><td>${esc(x.label)}</td><td>${fmtDiff(x.inn.diffStart||0)} → ${fmtDiff(r.diffEnd)}</td><td>${r.R}</td><td>${r.ER}</td><td>${r.UER}</td><td>${pas.length}</td><td>${r.pitches.length}</td><td>${H}</td><td>${XBH}</td><td>${BB}</td></tr>`}
  rows+=`<tr style="font-weight:700"><td>合計</td><td></td><td>${T.R}</td><td>${T.ER}</td><td>${T.UER}</td><td>${T.bf}</td><td>${T.n}</td><td>${T.H}</td><td>${T.XBH}</td><td>${T.BB}</td></tr>`;
  const runs=D.INN.flatMap(x=>x.r.runs.filter(z=>!z.inherited));

  const miss=runs.filter(isMiss).length;
  const cs=Object.entries(cause).sort((a,b)=>b[1]-a[1]);
  const mx=Math.max(1,...cs.map(c=>c[1]));
  const body=`<div class="tw"><table><thead><tr><th>イニング</th><th>点差</th><th>失点</th><th>自責</th><th>非自責</th><th>打者</th><th>球数</th><th>被安打</th><th>被長打</th><th>四死球</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="grid2" style="margin-top:12px"><div><h3>失点が入ったプレー</h3><div class="bars">${cs.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><span class="t"><i style="width:${v/mx*100}%;background:var(--bad)"></i></span><span class="num">${v}点</span></div>`).join('')||'<span class="muted small">失点なし</span>'}</div></div>
  <div><h3>投手以外の要因</h3><p style="margin:0">失点 ${runs.length}点のうち、<b>エラー・捕逸が絡んだ失点は ${miss}点</b>${T.inh?`、ほかに前の投手の走者の生還が ${T.inh}点`:''}あります。</p><p class="small muted">「絡んだ」＝エラー・捕逸で生還した、エラーで出塁した走者が生還した、または途中でエラー・捕逸で進塁した走者が生還した場合。</p></div></div>`;
  return sec(1,'基本情報・失点の概要',body);
}

/* ============ CSV・バックアップ ============ */
function csvEsc(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function buildCSV(kind){
  const lines=[];const inns=inningsOf();
  if(kind==='pitch'){lines.push(['投手','試合日','対戦相手','回','表裏','打席番号','打順','打者','打者左右','打席内の球番号','球種','コースX','コースY','コース（打者基準）','球速','投球結果','ボール','ストライク','アウト','一塁','二塁','三塁','打席結果','打球方向','打球種類','打球強度']);
    for(const inn of inns){const r=replay(inn);annotate(r);const g=S.recs.get(inn.gameId)||{},p=S.recs.get(inn.pitcherId)||{};
      for(const id of r.paOrder){const X=r.pas.get(id);for(const q of X.pitches){const e=q.ev;const last=q.last&&X.end;
        lines.push([p.name,g.date,g.opp,inn.inning,inn.half,X.pa.seq,X.pa.order,X.pa.name,X.pa.hand==='L'?'左':'右',q.n,e.type,e.loc?.x,e.loc?.y,region(e.loc?ixOf(e.loc.x,X.pa.hand):null,e.loc?.y??null),e.speed,RES[e.res],q.b,q.s,q.outs,q.bases[1]?1:0,q.bases[2]?1:0,q.bases[3]?1:0,last?PAR[X.result]:'',last&&X.end.dir?DIRS[X.end.dir]:'',last&&X.end.bb?BB_T[X.end.bb]:'',last?X.end.str||'':''])}}}}
  else if(kind==='pa'){lines.push(['投手','試合日','対戦相手','回','表裏','打席番号','打順','打者','打者左右','開始アウト','開始走者','球数','打席結果','打球方向','打球種類','打球強度','この打席での得点']);
    for(const inn of inns){const r=replay(inn);const g=S.recs.get(inn.gameId)||{},p=S.recs.get(inn.pitcherId)||{};
      for(const id of r.paOrder){const X=r.pas.get(id);lines.push([p.name,g.date,g.opp,inn.inning,inn.half,X.pa.seq,X.pa.order,X.pa.name,X.pa.hand==='L'?'左':'右',X.startOuts,basesTxt(X.startBases),X.pitches.length,PAR[X.result]||'',X.end&&X.end.dir?DIRS[X.end.dir]:'',X.end&&X.end.bb?BB_T[X.end.bb]:'',X.end?X.end.str||'':'',X.runs])}}}
  else {lines.push(['投手','試合日','対戦相手','回','表裏','開始時の点差','終了時の点差','失点','自責点','非自責点','前の投手の走者の生還','打者数','球数','記録者','状態']);
    for(const inn of inns){const r=replay(inn);const g=S.recs.get(inn.gameId)||{},p=S.recs.get(inn.pitcherId)||{};
      lines.push([p.name,g.date,g.opp,inn.inning,inn.half,inn.diffStart,r.diffEnd,r.R,r.ER,r.UER,r.inhR,r.pas.size,r.pitches.length,inn.recorder,inn.status==='done'?'確定':'記録中'])}}
  return '﻿'+lines.map(l=>l.map(csvEsc).join(',')).join('\r\n');
}
async function offerFile(filename,data,fallbackEl){
  try{const dl=await window.claude?.use?.('downloads');if(dl){await dl.save({filename,data});return true}}
  catch(e){if(e&&e.code==='declined'){toast('保存をやめました');return false}}
  const el=document.getElementById(fallbackEl);
  if(el){el.innerHTML=`<p class="small muted">この画面ではファイルを保存できないため、下の内容をすべて選んでコピーしてください。</p><textarea style="width:100%;height:160px;font-family:var(--mono);font-size:12px" readonly>${esc(data)}</textarea>`}
  return false;
}
async function doBackup(){
  const data=JSON.stringify({app:'shitten-inning',version:1,exportedAt:new Date().toISOString(),records:[...S.recs.values()]},null,1);
  const d=new Date();const name=`失点イニング_バックアップ_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  const ok=await offerFile(name,data,'csvout');
  if(ok&&!S.ro){const st=clone(settings());st.lastBackupAt=Date.now();st.inningsSinceBackup=0;await save(st);toast('バックアップを保存しました');render()}
}
let RESTORE=null;
function onRestoreFile(file){
  const fr=new FileReader();fr.onload=()=>{try{const j=JSON.parse(fr.result);if(!j||!Array.isArray(j.records))throw 0;
    const recs=j.records.filter(r=>r&&r.id&&r.kind);let nw=0,upd=0,old=0;
    for(const r of recs){const l=S.recs.get(r.id);if(!l)nw++;else if((r.updatedAt||0)>(l.updatedAt||0))upd++;else old++}
    RESTORE=recs;
    $('#restoreinfo').innerHTML=`<div class="banner info col" style="margin:0"><span>ファイル内の記録 ${recs.length}件：新しく加わる ${nw}件・更新される ${upd}件・今の方が新しい ${old}件</span><div class="row"><button class="pri" data-a="restoremerge">追加・更新する</button><button class="danger" data-a="restorereplace">今の記録を置き換える</button><button data-a="restorecancel">やめる</button></div></div>`;
  }catch(e){toast('バックアップファイルとして読めませんでした')}};fr.readAsText(file);
}
async function applyRestore(replace){
  if(!RESTORE)return;
  if(replace){await IDB.setMeta('autobackup',[...S.recs.values()]);
    for(const r of [...S.recs.values()]) if(!RESTORE.find(x=>x.id===r.id)){S.recs.delete(r.id);await IDB.del(r.id).catch(()=>{});S.cloud.pending.add(r.id)}}
  for(const r of RESTORE){const l=S.recs.get(r.id);if(replace||!l||(r.updatedAt||0)>(l.updatedAt||0)){S.recs.set(r.id,r);S.cloud.pending.add(r.id)}}
  await IDB.putMany([...S.recs.values()]).catch(()=>{});Cloud.flush();RESTORE=null;toast('復元しました');render();
}

/* ============ サンプル ============ */
async function loadSample(){
  const p={id:uid('pit'),kind:'pitcher',name:'サンプル投手',throws:'R',sample:true};
  const g={id:uid('gam'),kind:'game',date:'2026-10-10',opp:'サンプル大学',lineup:{},sample:true};
  const inn={id:uid('inn'),kind:'inning',sample:true,pitcherId:p.id,gameId:g.id,inning:5,half:'裏',diffStart:1,startOuts:0,startBases:{1:false,2:false,3:false},recorder:'サンプル',status:'done',pas:[],events:[],createdAt:Date.now()};
  const T={直:'ストレート',ス:'スライダー',カ:'カーブ',フ:'フォーク'};
  const plan=[
    {o:1,h:'L',p:[['直',.7,.6,134,'CS'],['ス',1.2,.1,118,'B'],['直',.4,.8,133,'F'],['直',.55,.55,132,'IP']],res:'1B',dir:8,bb:'L',str:'強'},
    {o:2,h:'R',p:[['ス',1.25,-.1,117,'B'],['直',-.15,.9,133,'B'],['直',.3,1.2,134,'B'],['直',.6,.5,131,'CS'],['直',1.15,.4,132,'B']],res:'BB'},
    {o:3,h:'R',p:[['直',.8,.3,133,'CS'],['ス',1.1,.0,119,'SS'],['フ',.5,-.3,125,'B'],['フ',.45,-.25,124,'SS']],res:'K'},
    {o:4,h:'L',p:[['直',.2,.7,132,'B'],['直',.75,.35,133,'CS'],['ス',.5,.45,116,'IP']],res:'2B',dir:7,bb:'L',str:'強',scoreBoth:true},
    {run:'WP'},
    {o:5,h:'R',p:[['直',.9,.6,131,'F'],['カ',.5,1.3,104,'B'],['直',.35,.4,132,'IP']],res:'GO',dir:6,bb:'G',str:'普通'},
    {o:6,h:'R',p:[['ス',.95,.2,118,'CS'],['直',.55,.75,133,'IP']],res:'FO',dir:9,bb:'F',str:'普通'}];
  for(const step of plan){
    if(step.run){const r=replay(inn);inn.events.push({id:uid('ev'),k:'run',kind:step.run,moves:suggest(step.run,r.state.bases,null).filter(m=>m.to!==m.from),note:''});continue}
    const pa={id:uid('pa'),seq:inn.pas.length+1,order:step.o,name:'',hand:step.h};inn.pas.push(pa);g.lineup[step.o]={name:'',hand:step.h};
    for(const [t,x,y,sp,res] of step.p)inn.events.push({id:uid('ev'),k:'pitch',pa:pa.id,type:T[t],loc:{x,y},speed:sp,res});
    const r=replay(inn);
    inn.events.push({id:uid('ev'),k:'paend',pa:pa.id,result:step.res,dir:step.dir||null,bb:step.bb||null,str:step.str||null,moves:suggest(step.res,r.state.bases,pa.id)});
  }
  // 二塁打で一塁走者も生還
  const e4=inn.events.filter(e=>e.k==='paend')[3];e4.moves.forEach(m=>{if(m.from===1)m.to='H'});
  await save(p);await save(g);await save(inn);
  S.an.pitcher=p.id;S.an.inns=null;toast('サンプルを読み込みました');render();
}

/* ============ 操作 ============ */
function ask(title,msg,yes,fn,danger){S.confirm={title,msg,yes,fn,danger};renderOv()}
document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;const d=el.dataset;
  if(el.tagName==='SELECT'||el.tagName==='INPUT')return;
  if(a==='ovbg'&&ev.target===el){S.confirm=null;renderOv();return}
  switch(a){
    case 'go':nav(d.v);break;
    case 'newinn':startSetup(null);break;
    case 'sample':await loadSample();break;
    case 'openrec':openRec(d.id);break;
    case 'opentl':S.tlId=d.id;S.innId=d.id;nav('timeline');break;
    case 'editinn':startSetup(S.recs.get(d.id));break;
    case 'delinn':{const inn=S.recs.get(d.id);ask('イニングを削除','「'+innLabel(inn)+'」をゴミ箱に移します。30日以内なら設定画面から元に戻せます。','ゴミ箱に移す',async()=>{inn.deleted=true;inn.deletedAt=Date.now();await save(inn);toast('ゴミ箱に移しました');render()},true);break}
    case 'anfor':S.an.pitcher=d.id;S.an.inns=null;nav('analysis');break;
    case 'cyes':{const f=S.confirm.fn;S.confirm=null;renderOv();await f();break}
    case 'cno':S.confirm=null;renderOv();break;
    // setup
    case 'fset':readForm();S.form[d.k]=d.num?Number(d.v):d.v;render();break;
    case 'ftog':readForm();S.form[d.k]=!S.form[d.k];render();break;
    case 'fstep':{readForm();const f=S.form;if(d.k==='inning')f.inning=Math.max(1,Math.min(15,f.inning+Number(d.d)));else f.diff=f.diff+Number(d.d);render();break}
    case 'savesetup':await saveSetup();break;
    // record
    case 'type':S.draft.type=d.v;render();break;
    case 'key':{let s=S.draft.speed||'';if(d.v==='⌫')s=s.slice(0,-1);else if(d.v==='C')s='';else if(s.length<3)s+=d.v;S.draft.speed=s;const e=$('#spd');if(e)e.textContent=s||'—';break}
    case 'noloc':S.draft.loc=null;render();break;
    case 'res':await commitPitch(d.v);break;
    case 'editp':{const inn=curInn();const e=inn.events.find(x=>x.id===d.id);if(!e)break;if(S.view!=='record'){S.innId=inn.id;S.view='record'}S.editId=e.id;S.draft={type:e.type,loc:e.loc?{...e.loc}:null,speed:e.speed?String(e.speed):''};render();break}
    case 'canceledit':S.editId=null;S.draft={type:null,loc:null,speed:''};render();break;
    case 'delev':{const inn=curInn();ask('記録を削除','この記録を削除します。以降のカウントや走者は自動で計算し直します。','削除する',async()=>{inn.events=inn.events.filter(e=>e.id!==d.id);cleanPAs(inn);await save(inn);S.editId=null;S.draft={type:null,loc:null,speed:''};setNextBatter(inn);render()},true);break}
    case 'undo':{const inn=curInn();const e=inn.events.pop();if(!e)break;S.redo.push(e);cleanPAs(inn);await save(inn);setNextBatter(inn);toast('1つ取り消しました');render();break}
    case 'redo':{const inn=curInn();const e=S.redo.pop();if(!e)break;if(e.pa&&!(inn.pas||[]).find(p=>p.id===e.pa)&&e._paObj)inn.pas.push(e._paObj);delete e._paObj;inn.events.push(e);await save(inn);setNextBatter(inn);render();break}
    case 'bord':{const inn=curInn();const r=replay(inn);const pa=r.state.pa?(inn.pas||[]).find(x=>x.id===r.state.pa):null;const tgt=pa||S.next;tgt.order=((tgt.order-1+Number(d.d)+9)%9)+1;if(!pa){const g=S.recs.get(inn.gameId)||{};const lu=(g.lineup||{})[tgt.order];if(lu){S.next.name=lu.name||'';S.next.hand=lu.hand||'R'}}else await save(inn);render();break}
    case 'bhand':{const inn=curInn();const r=replay(inn);const pa=r.state.pa?(inn.pas||[]).find(x=>x.id===r.state.pa):null;if(pa){pa.hand=d.v;await save(inn)}else S.next.hand=d.v;render();break}
    case 'openpaend':openPaEnd(curInn());renderOv();break;
    case 'editpaend':{const inn=S.recs.get(S.innId)||S.recs.get(S.tlId);S.innId=inn.id;const e=inn.events.find(x=>x.id===d.id);openPaEnd(inn,null,e);renderOv();break}
    case 'pres':{const sh=S.sheet;sh.result=d.v;sh.moves=suggest(d.v,sh.bases,sh.pa);renderOv();break}
    case 'pdir':S.sheet.dir=Number(d.v);renderOv();break;
    case 'pbb':S.sheet.bb=d.v;renderOv();break;
    case 'pstr':S.sheet.str=d.v;renderOv();break;
    case 'mvto':{const sh=S.sheet;const from=d.from==='B'?'B':Number(d.from);const to=d.v==='O'||d.v==='H'?d.v:Number(d.v);let m=sh.moves.find(m=>m.r===d.r);if(!m){m={r:d.r,from,to,er:true};sh.moves.push(m)}m.to=to;if(to==='H'&&m.er==null)m.er=true;renderOv();break}
    case 'mver':{const m=S.sheet.moves.find(m=>m.r===d.r);if(m)m.er=m.er===false;renderOv();break}
    case 'okpaend':await commitPaEnd();break;
    case 'closesheet':S.sheet=null;renderOv();break;
    case 'openrun':openRun();renderOv();break;
    case 'rkind':{const sh=S.sheet;sh.kind=d.v;sh.moves=suggest(d.v,sh.bases,null);renderOv();break}
    case 'okrun':await commitRun();break;
    case 'openfix':openFix();renderOv();break;
    case 'fxo':S.sheet.outs=Number(d.v);renderOv();break;
    case 'fxb':S.sheet.b=Number(d.v);renderOv();break;
    case 'fxs':S.sheet.s=Number(d.v);renderOv();break;
    case 'fxbase':{const k=d.v;S.sheet.bases[k]=S.sheet.bases[k]?null:true;renderOv();break}
    case 'okfix':await commitFix();break;
    case 'opengameend':S.sheet={type:'gameend'};renderOv();break;
    case 'okgameend':{const inn=curInn();inn.status='done';inn.ended='game';await save(inn);S.sheet=null;toast('記録を確定しました');nav('home');break}
    case 'finish':{const inn=curInn();inn.status='done';inn.ended='3out';await save(inn);toast('記録を確定しました');S.tlId=inn.id;nav('timeline');break}
    // analysis
    case 'anh':S.an.hand=d.v;render();break;
    case 'ani':{const s=S.an.inns;s.has(d.id)?s.delete(d.id):s.add(d.id);render();break}
    case 'antl':S.an.tlInn=d.id;render();document.getElementById('s2')?.scrollIntoView({block:'start'});break;
    case 'anzm':S.an.zmode=d.v;render();document.getElementById('s5')?.scrollIntoView({block:'start'});break;
    case 'csvmenu':nav('settings');break;
    // settings
    case 'ptadd':{readTypes();const st=clone(settings());st.pitchTypes=S._types||st.pitchTypes;st.pitchTypes.push({name:'新しい球種',abbr:'新',hidden:false});await save(st);render();break}
    case 'pthide':{readTypes();const st=clone(settings());st.pitchTypes=S._types||st.pitchTypes;const t=st.pitchTypes[Number(d.i)];t.hidden=!t.hidden;await save(st);render();break}
    case 'ptsave':await saveTypes();break;
    case 'backup':await doBackup();break;
    case 'restoremerge':await applyRestore(false);break;
    case 'restorereplace':ask('記録を置き換え','今の記録をすべて、ファイルの内容に置き換えます。置き換える前の記録は端末内に一時的に控えておきます。','置き換える',()=>applyRestore(true),true);break;
    case 'restorecancel':RESTORE=null;$('#restoreinfo').innerHTML='';break;
    case 'csv':{const names={pitch:'投球',pa:'打席',inn:'イニング'};await offerFile(`失点イニング_${names[d.v]}.csv`,buildCSV(d.v),'csvout');break}
    case 'untrash':{const r=S.recs.get(d.id);delete r.deleted;delete r.deletedAt;await save(r);render();break}
    case 'purge':ask('完全に削除','このイニングを完全に削除します。元に戻せません。','完全に削除',async()=>{await hardDelete(d.id);render()},true);break;
    case 'delsample':ask('サンプルを削除','サンプルの投手・試合・イニングを削除します。','削除する',async()=>{for(const r of [...S.recs.values()])if(r.sample)await hardDelete(r.id);S.an.pitcher=null;S.an.inns=null;render()},true);break;
  }
});
document.addEventListener('change',async ev=>{
  const el=ev.target;const a=el.dataset&&el.dataset.a;
  if(el.id==='restore'&&el.files&&el.files[0]){onRestoreFile(el.files[0]);return}
  if(a==='fp'){readForm();S.form.pitcherId=el.value;render()}
  else if(a==='fg'){readForm();S.form.gameId=el.value;render()}
  else if(a==='anp'){S.an.pitcher=el.value;S.an.inns=null;S.an.tlInn=null;render()}
  else if(a==='anzt'){S.an.ztype=el.value;render();document.getElementById('s5')?.scrollIntoView({block:'start'})}
  else if(a==='bname'){const inn=curInn();const r=replay(inn);const pa=r.state.pa?(inn.pas||[]).find(x=>x.id===r.state.pa):null;if(pa){pa.name=el.value.trim();await save(inn)}else S.next.name=el.value}
});
function readTypes(){const st=settings();S._types=st.pitchTypes.map((t,i)=>({...t,name:(document.getElementById('pt-n-'+i)||{}).value?.trim()||t.name,abbr:(document.getElementById('pt-a-'+i)||{}).value?.trim()||t.abbr}))}
async function saveTypes(){
  readTypes();const st=clone(settings());const old=st.pitchTypes;const nw=S._types;
  const names=nw.map(t=>t.name);if(new Set(names).size!==names.length){toast('同じ名前の球種があります');return}
  for(let i=0;i<old.length;i++){if(nw[i]&&old[i].name!==nw[i].name){for(const inn of live('inning')){let ch=false;(inn.events||[]).forEach(e=>{if(e.k==='pitch'&&e.type===old[i].name){e.type=nw[i].name;ch=true}});if(ch)await save(inn)}}}
  st.pitchTypes=nw;await save(st);S._types=null;toast('球種を保存しました');render();
}
function cleanPAs(inn){const used=new Set((inn.events||[]).map(e=>e.pa).filter(Boolean));const keep=[];for(const p of (inn.pas||[])){if(used.has(p.id))keep.push(p);else{const r=S.redo.find(e=>e.pa===p.id);if(r)r._paObj=p}}inn.pas=keep;inn.pas.forEach((p,i)=>p.seq=i+1)}

/* キーボード（PC） */
document.addEventListener('keydown',async ev=>{
  if(S.view!=='record'||S.sheet||S.confirm||S.ro)return;
  const t=ev.target;if(t&&(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA'))return;
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='z'){ev.preventDefault();document.querySelector('[data-a="undo"]')?.click();return}
  if(ev.code&&ev.code.startsWith('Numpad')&&/\d/.test(ev.key)){const s=S.draft.speed||'';if(s.length<3){S.draft.speed=s+ev.key;const e=$('#spd');if(e)e.textContent=S.draft.speed}return}
  if(ev.key==='Backspace'){S.draft.speed=(S.draft.speed||'').slice(0,-1);const e=$('#spd');if(e)e.textContent=S.draft.speed||'—';return}
  if(ev.code&&ev.code.startsWith('Digit')){const i=Number(ev.key)-1;const ts=typeList().filter(t=>!t.hidden);if(ts[i]){S.draft.type=ts[i].name;render()}return}
  const map={b:'B',s:'CS',w:'SS',f:'F',i:'IP',h:'HBP',o:'OT'};const k=map[ev.key.toLowerCase()];
  if(k&&!ev.ctrlKey&&!ev.metaKey){ev.preventDefault();const btn=document.querySelector(`[data-a="res"][data-v="${k}"]`);if(btn&&!btn.disabled)await commitPitch(k)}
});

/* 同じ端末で2つ開いたとき */
try{const bc=new BroadcastChannel('shitten-app');const me=Date.now();bc.postMessage({hello:me});bc.onmessage=m=>{if(m.data.hello&&m.data.hello>me)bc.postMessage({here:me});if(m.data.here&&!S.ro){S.ro=true;S.cloud.status=S.cloud.status;render();toast('別のタブで開いているため、このタブは閲覧専用にしました')}}}catch(e){}

/* ============ 起動 ============ */
(async function boot(){
  try{await IDB.open();const all=await IDB.all();all.forEach(r=>S.recs.set(r.id,r));const pend=await IDB.getMeta('pending');if(pend)pend.forEach(id=>S.cloud.pending.add(id))}catch(e){S.localOk=false}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  // 30日を過ぎたゴミ箱を整理
  for(const r of [...S.recs.values()]) if(r.deleted&&r.deletedAt&&Date.now()-r.deletedAt>30*864e5) await hardDelete(r.id);
  render();
  Cloud.init();
})();
</script>
